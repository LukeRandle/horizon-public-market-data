name: Refresh public government headlines
on:
  schedule:
    - cron: '3,18,33,48 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: public-government-headline-publication
  cancel-in-progress: false
jobs:
  refresh:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    permissions:
      contents: write
    steps:
      - name: Check out public data repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Validate public headline collector
        run: python3 -m unittest discover -s tools -p 'test_*.py'
      - name: Check official public government feeds
        run: python3 tools/refresh-news.py
      - name: Publish government headline metadata
        run: |
          git config user.name 'Horizon public data'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- data/government-news.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Refresh original public government headlines'
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
