name: Refresh public commodity history
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: world-bank-commodity-publication
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - name: Check out public data repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Validate publisher
        run: python3 -m unittest discover -s tools -p 'test_*.py'
      - name: Check current official workbook
        run: python3 tools/refresh-world-bank.py
      - name: Publish validated public data
        run: |
          git config user.name 'Horizon public data'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- data/world-bank-cycles.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Refresh attributed World Bank commodity history'
          git push origin HEAD:main
